name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "21"

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.99.3
        with:
          path: .
          extra_args: --only-verified

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test -x ktlintCheck

      - name: Run integration tests
        run: ./gradlew integrationTest -x ktlintCheck -x test

      - name: Generate coverage reports
        run: ./gradlew koverXmlReport koverHtmlReport -x ktlintCheck

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/reports/kover/html

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/reports/kover/report.xml

      - name: Extract coverage from Kover XML
        id: coverage
        run: |
          if [ ! -f build/reports/kover/report.xml ]; then
            echo "Kover XML report not found: build/reports/kover/report.xml" >&2
            exit 1
          fi
          TOTAL_COVERED=$(grep 'type="LINE"' build/reports/kover/report.xml \
            | sed -n 's/.*covered="\([0-9]*\)".*/\1/p' \
            | awk '{s+=$1} END {print s}')
          TOTAL_MISSED=$(grep 'type="LINE"' build/reports/kover/report.xml \
            | sed -n 's/.*missed="\([0-9]*\)".*/\1/p' \
            | awk '{s+=$1} END {print s}')
          TOTAL=$((TOTAL_COVERED + TOTAL_MISSED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "No LINE counters found in Kover XML report" >&2
            exit 1
          fi
          COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($TOTAL_COVERED/$TOTAL)*100}")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Comment coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}'
            const body = `
            ### Code Coverage Report

              **Line coverage:** ${coverage}%

            Source: Kover XML report
            Gate: enforced via \`koverVerify\`
            `
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build project
        run: ./gradlew build -x ktlintCheck -x test -x integrationTest

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [static-analysis, test, build]
    permissions:
      contents: read
      packages: write
    env:
      SYSTEM_TESTS_TOKEN: ${{ secrets.SYSTEM_TESTS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags=("${image}:sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("${image}:${GITHUB_REF_NAME}")
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${image}:latest")
          fi
          echo "tags=$(IFS=' '; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"
          echo "primary=${tags[0]}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$tag"); done
          docker build "${args[@]}" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Quick test
        env:
          BACKEND_IMAGE: ${{ steps.tags.outputs.primary }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 db backend
          curl -fsS http://localhost:8080/actuator/health

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown services
        if: always()
        run: docker compose down -v

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do docker push "$tag"; done

      - name: Trigger system tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SYSTEM_TESTS_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SYSTEM_TESTS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/QMemoryCards/system-testing/dispatches \
            -d "{\"event_type\":\"images-published\",\"client_payload\":{\"source\":\"backend\",\"sha\":\"${GITHUB_SHA}\"}}"

      - name: Warn about missing system tests token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SYSTEM_TESTS_TOKEN == ''
        run: echo "::warning::SYSTEM_TESTS_TOKEN is not set; system tests will not run automatically."

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
